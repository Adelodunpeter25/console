# Packages the GPUI desktop app (Console.app) for Intel + Apple Silicon macOS
# on each push to main, then uploads them to a rolling GitHub Release tagged
# `console-desktop` (latest always wins), mirroring console-server.yml.
#
# Assets: Console-macos-x64.zip + Console-macos-arm64.zip (ditto-packed .app
# bundles, ad-hoc signed — see apps/desktop/scripts/build.sh).
name: Build console-desktop

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-14
    strategy:
      matrix:
        include:
          - os-suffix: macos-x64
            rust-target: x86_64-apple-darwin
          - os-suffix: macos-arm64
            rust-target: aarch64-apple-darwin
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          # Must match rust-toolchain.toml (source of truth); explicit here
          # so the runner doesn't fetch latest stable first.
          toolchain: 1.97.1
          targets: ${{ matrix.rust-target }}

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop
          key: ${{ matrix.rust-target }}

      # Intel cross-compiles from the Apple Silicon runner via the universal
      # macOS SDK; icon generation (sips/iconutil) and ad-hoc codesign run
      # natively on the runner. --locked fails loudly on dependency drift
      # instead of silently floating to a broken graph.
      - name: Package Console.app
        run: >
          bash apps/desktop/scripts/build.sh
          --mode prod
          --release
          --bundle-id com.console.desktop
          --app-name "Console"
          --target ${{ matrix.rust-target }}
          --out-dir "$RUNNER_TEMP/dist"
          --locked

      # ditto preserves codesigning and resource forks inside the zip.
      - name: Zip app bundle
        run: |
          ditto -c -k --sequesterRsrc --keepParent \
            "$RUNNER_TEMP/dist/Console.app" \
            "Console-${{ matrix.os-suffix }}.zip"

      - name: Upload package artifact
        uses: actions/upload-artifact@v4
        with:
          name: Console-${{ matrix.os-suffix }}
          path: Console-${{ matrix.os-suffix }}.zip
          if-no-files-found: error

  # Single publisher: both matrix jobs previously uploaded to the same
  # rolling release in parallel, racing inside action-gh-release. Builds
  # stay parallel; only this job mutates the release.
  publish:
    needs: build
    runs-on: ubuntu-latest

    # Prevent overlapping pushes from modifying the rolling release together.
    concurrency:
      group: console-desktop-release
      cancel-in-progress: true

    steps:
      - name: Download packages
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Publish rolling release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: console-desktop
          name: console-desktop (latest)
          prerelease: false
          # console-server owns the repo's "latest" pointer; don't flap it.
          make_latest: false
          files: |
            dist/Console-macos-x64.zip
            dist/Console-macos-arm64.zip
