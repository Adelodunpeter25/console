# Builds the native Kotlin/Compose Android app (apps/android) debug APK
# manually via workflow_dispatch, then uploads it to a rolling GitHub Release
# tagged `console-android` (latest always wins), mirroring console-server.yml /
# console-desktop.yml.
#
# Assets: app-debug.apk (unsigned debug build — see apps/android/app/build.gradle.kts).
name: Build console-android

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # ubuntu-latest runners ship a preinstalled Android SDK (cmdline-tools,
      # platform-tools, build-tools, licenses pre-accepted) at $ANDROID_HOME.
      # android-actions/setup-android@v3 tries to additionally install the
      # legacy "tools" package via sdkmanager, which Google removed from the
      # SDK repository — that step now always fails, so skip it entirely.
      # Gradle resolves any missing compileSdk/build-tools itself on demand.
      - name: Build debug APK
        working-directory: apps/android
        run: ./gradlew assembleDebug --no-daemon --max-workers=1

      - name: Rename APK for release
        run: cp apps/android/app/build/outputs/apk/debug/app-debug.apk app-debug.apk

      - name: Upload to rolling release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: console-android
          name: console-android (latest)
          prerelease: false
          # console-server owns the repo's "latest" pointer; don't flap it.
          make_latest: false
          files: app-debug.apk
