# Builds the native Kotlin/Compose Android app (apps/android) release APK on
# each push to main, then uploads it to a rolling GitHub Release tagged
# `console-android` (latest always wins), mirroring console-server.yml /
# console-desktop.yml.
#
# Assets: app-release.apk (com.console.mobile)
#
# Release only. The debug APK was a second artifact on the same job, and it
# doubled the build for a variant nobody installs from a release tag — the
# debug build type is still available locally (`./gradlew assembleDebug`), it
# just is not published.
#
# The release keystore is reconstructed from repo secrets on every run. It
# must stay a *fixed* key: a per-run generated key would make each APK a
# different app, so no two builds could ever update one another on a device
# (INSTALL_FAILED_UPDATE_INCOMPATIBLE).
name: Build console-android

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    # One publisher at a time: two pushes racing on the same rolling release
    # would let the older build overwrite the newer assets.
    concurrency:
      group: console-android-release
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      # ubuntu-latest runners ship a preinstalled Android SDK (cmdline-tools,
      # platform-tools, build-tools, licenses pre-accepted) at $ANDROID_HOME.
      # android-actions/setup-android@v3 tries to additionally install the
      # legacy "tools" package via sdkmanager, which Google removed from the
      # SDK repository — that step now always fails, so skip it entirely.
      # Gradle resolves any missing compileSdk/build-tools itself on demand.
      - name: Restore release keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          mkdir -p apps/android/keystore
          printf '%s' "$ANDROID_KEYSTORE_BASE64" \
            | base64 --decode > apps/android/keystore/console-release.keystore
          cat > apps/android/key.properties <<EOF
          storeFile=keystore/console-release.keystore
          storePassword=$ANDROID_KEYSTORE_PASSWORD
          keyAlias=$ANDROID_KEY_ALIAS
          keyPassword=$ANDROID_KEY_PASSWORD
          EOF

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          # Must match rust-toolchain.toml (source of truth), the same pin the
          # desktop workflow uses.
          toolchain: 1.97.1
          targets: aarch64-linux-android,x86_64-linux-android

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/android/rust-wt

      # libconsole_wt_android.so is gitignored on purpose (a binary is not a
      # reviewable artifact) and produced by rust-wt/build.sh, so without this
      # step both APKs ship with no WebTransport at all. The app falls back to
      # SSE/WS when the library is missing, which is exactly why this runs: a
      # silent downgrade on every released APK is not a fallback, it is a bug.
      #
      # The NDK is resolved here instead of being left to Gradle, which installs
      # one during the build — already too late for this step.
      - name: Stage the WebTransport library
        working-directory: apps/android
        run: |
          set -euo pipefail
          SDK="${ANDROID_HOME:-$ANDROID_SDK_ROOT}"
          NDK_VERSION=28.2.13676358
          # The script links with the versioned clang wrappers (API 21), so an
          # NDK is only usable if it ships them — the newest one on the runner
          # is not automatically it.
          usable() {
            [[ -n "${1:-}" ]] && compgen -G "$1"/toolchains/llvm/prebuilt/*/bin/aarch64-linux-android21-clang >/dev/null
          }
          NDK_DIR="$SDK/ndk/$NDK_VERSION"
          if ! usable "$NDK_DIR"; then
            NDK_DIR=""
            for candidate in "$SDK"/ndk/*; do
              if usable "$candidate"; then NDK_DIR="$candidate"; break; fi
            done
          fi
          if ! usable "$NDK_DIR"; then
            SDKMANAGER="$(ls -d "$SDK"/cmdline-tools/*/bin/sdkmanager 2>/dev/null | head -1 || true)"
            if [[ -z "$SDKMANAGER" ]]; then
              echo "No usable NDK and no sdkmanager under $SDK" >&2
              exit 1
            fi
            yes | "$SDKMANAGER" --install "ndk;$NDK_VERSION"
            NDK_DIR="$SDK/ndk/$NDK_VERSION"
          fi
          echo "Staging WebTransport with NDK at $NDK_DIR"
          ANDROID_NDK_HOME="$NDK_DIR" bash rust-wt/build.sh

      - name: Build the release APK
        working-directory: apps/android
        run: ./gradlew assembleRelease

      # The app runs without the library (SSE/WS fallback), so a packaging
      # mistake here is invisible on the device — only WebTransport quietly
      # stops being used. Assert it instead of trusting the step above.
      - name: Verify the APK carries WebTransport
        run: |
          set -euo pipefail
          apk=apps/android/app/build/outputs/apk/release/app-release.apk
          unzip -l "$apk" | grep -q 'lib/arm64-v8a/libconsole_wt_android.so' \
            || { echo "$apk is missing libconsole_wt_android.so" >&2; exit 1; }

      - name: Collect the APK
        run: |
          cp apps/android/app/build/outputs/apk/release/app-release.apk app-release.apk

      # Retried: the upload itself usually succeeds but the action's final
      # release API call occasionally times out (Headers Timeout Error).
      # Re-runs are safe — assets are deleted then re-uploaded.
      - name: Upload to rolling release
        uses: Wandalen/wretry.action@v3
        with:
          attempt_limit: 3
          attempt_delay: 15000
          action: softprops/action-gh-release@v2
          with: |
            tag_name: console-android
            name: console-android (latest)
            prerelease: false
            # console-server owns the repo's "latest" pointer; don't flap it.
            make_latest: false
            files: |
              app-release.apk
