# Builds the native Kotlin/Compose Android app (apps/android) release and debug
# APKs manually via workflow_dispatch, then uploads them to a rolling GitHub Release
# tagged `console-android` (latest always wins), mirroring console-server.yml /
# console-desktop.yml.
#
# Assets: app-release.apk (com.console.mobile), app-debug.apk (com.console.mobile.dev)
#
# The release keystore is reconstructed from repo secrets on every run. This
# must stay a *fixed* key: the debug build type is configured to sign with it
# too, because the runner's auto-generated debug keystore changes on every job,
# so no two builds could ever update one another on a device
# (INSTALL_FAILED_UPDATE_INCOMPATIBLE).
name: Build console-android

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # ubuntu-latest runners ship a preinstalled Android SDK (cmdline-tools,
      # platform-tools, build-tools, licenses pre-accepted) at $ANDROID_HOME.
      # android-actions/setup-android@v3 tries to additionally install the
      # legacy "tools" package via sdkmanager, which Google removed from the
      # SDK repository — that step now always fails, so skip it entirely.
      # Gradle resolves any missing compileSdk/build-tools itself on demand.
      - name: Restore release keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          mkdir -p apps/android/keystore
          printf '%s' "$ANDROID_KEYSTORE_BASE64" \
            | base64 --decode > apps/android/keystore/console-release.keystore
          cat > apps/android/key.properties <<EOF
          storeFile=keystore/console-release.keystore
          storePassword=$ANDROID_KEYSTORE_PASSWORD
          keyAlias=$ANDROID_KEY_ALIAS
          keyPassword=$ANDROID_KEY_PASSWORD
          EOF

      - name: Build release and debug APKs
        working-directory: apps/android
        run: ./gradlew assembleRelease assembleDebug --no-daemon --max-workers=1

      - name: Collect APKs
        run: |
          cp apps/android/app/build/outputs/apk/release/app-release.apk app-release.apk
          cp apps/android/app/build/outputs/apk/debug/app-debug.apk app-debug.apk

      - name: Upload to rolling release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: console-android
          name: console-android (latest)
          prerelease: false
          # console-server owns the repo's "latest" pointer; don't flap it.
          make_latest: false
          files: |
            app-release.apk
            app-debug.apk
