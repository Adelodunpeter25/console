# Builds the native Kotlin/Compose Android app (apps/android) debug APK on
# each push to main, then uploads it to a rolling GitHub Release tagged
# `console-android` (latest always wins), mirroring console-server.yml /
# console-desktop.yml.
#
# Assets: app-debug.apk (unsigned debug build — see apps/android/app/build.gradle.kts).
name: Build console-android

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # Installs cmdline-tools + accepts SDK licenses; platform/build-tools
      # versions are resolved from apps/android's Gradle config on demand.
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Build debug APK
        working-directory: apps/android
        run: ./gradlew assembleDebug --no-daemon --max-workers=1

      - name: Rename APK for release
        run: cp apps/android/app/build/outputs/apk/debug/app-debug.apk app-debug.apk

      - name: Upload to rolling release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: console-android
          name: console-android (latest)
          prerelease: false
          # console-server owns the repo's "latest" pointer; don't flap it.
          make_latest: false
          files: app-debug.apk
