# Builds the multi-call `console` binary (management CLI + agent server in one
# executable) for every platform on each push to main, then uploads them to a
# rolling GitHub Release tagged `console-server` (latest always wins).
#
# Assets: console-<suffix> + libfff_c-<suffix>.{so,dylib} sidecar (fff native lib,
# missing from `bun build --compile` output — see docs/notes/fff-native-library-fix.md).
name: Build console

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - os-suffix: linux-x64
            bun-target: bun-linux-x64
            install-os: linux
            install-cpu: x64
            lib-asset: libfff_c-linux-x64.so
            bin-package: fff-bin-linux-x64-gnu
            lib-file: libfff_c.so
          - os-suffix: macos-x64
            bun-target: bun-darwin-x64
            install-os: darwin
            install-cpu: x64
            lib-asset: libfff_c-macos-x64.dylib
            bin-package: fff-bin-darwin-x64
            lib-file: libfff_c.dylib
          - os-suffix: macos-arm64
            bun-target: bun-darwin-aarch64
            install-os: darwin
            install-cpu: arm64
            lib-asset: libfff_c-macos-arm64.dylib
            bin-package: fff-bin-darwin-arm64
            lib-file: libfff_c.dylib
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      # Install optional native deps for the TARGET platform, not the runner.
      # ffi-rs (via @ff-labs/fff-node) ships a .node addon per os/arch; without
      # this override a cross-compiled binary would miss its addon and crash.
      - name: Install dependencies (for target platform)
        run: bun install --frozen-lockfile --os=${{ matrix.install-os }} --cpu=${{ matrix.install-cpu }}

      # Patch fff-node's findBinary() so the bundled build checks FFF_LIB_PATH
      # and the binary's own directory before the npm-package lookup.
      - name: Patch fff-node sidecar lookup
        run: bun scripts/patch-fff-binary.mjs

      # Copy the target platform's libfff_c out of its optional bin package as
      # a release sidecar (bun --compile embeds JS, not the .so/.dylib).
      - name: Stage fff native sidecar
        run: |
          for base in node_modules apps/server/node_modules; do
            src="$base/@ff-labs/${{ matrix.bin-package }}/${{ matrix.lib-file }}"
            if [ -f "$src" ]; then
              cp "$src" "${{ matrix.lib-asset }}"
              echo "staged $src"
              exit 0
            fi
          done
          echo "missing lib: @ff-labs/${{ matrix.bin-package }}/${{ matrix.lib-file }}"
          ls node_modules/@ff-labs/ || true
          ls apps/server/node_modules/@ff-labs/ || true
          exit 1

      # Flags: --minify shrinks bundled JS; --sourcemap (zstd-compressed) keeps
      # stacktraces pointing at TS source in production crashes.
      - name: Build console binary
        run: |
          bun build --compile --minify --sourcemap \
            apps/cli/console.ts \
            --target=${{ matrix.bun-target }} \
            --outfile console-${{ matrix.os-suffix }}

      - name: Upload package artifact
        uses: actions/upload-artifact@v4
        with:
          name: console-${{ matrix.os-suffix }}
          path: |
            console-${{ matrix.os-suffix }}
            ${{ matrix.lib-asset }}
          if-no-files-found: error

  # Single publisher: the matrix jobs previously uploaded to the same
  # rolling release in parallel, racing inside action-gh-release. Builds
  # stay parallel; only this job mutates the release.
  publish:
    needs: build
    runs-on: ubuntu-latest

    # Prevent overlapping pushes from modifying the rolling release together.
    concurrency:
      group: console-server-release
      cancel-in-progress: true

    steps:
      - name: Download packages
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      # Retried: the upload itself usually succeeds but the action's final
      # release API call occasionally times out (Headers Timeout Error).
      # Re-runs are safe — assets are deleted then re-uploaded.
      - name: Publish rolling release
        uses: Wandalen/wretry.action@v3
        with:
          attempt_limit: 3
          attempt_delay: 15000
          action: softprops/action-gh-release@v2
          with: |
            tag_name: console-server
            name: console-server (latest)
            prerelease: false
            make_latest: true
            files: |
              dist/console-linux-x64
              dist/libfff_c-linux-x64.so
              dist/console-macos-x64
              dist/libfff_c-macos-x64.dylib
              dist/console-macos-arm64
              dist/libfff_c-macos-arm64.dylib
