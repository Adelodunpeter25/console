# Builds the agent server as standalone single-binary executables on every
# push to main and uploads them to a rolling GitHub Release tagged
# `console-server` (no versioning — latest always wins).
name: Build console-server

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      # Cross-compile from Linux for both platforms Bun supports here.
      # Flags: --minify shrinks bundled JS, --sourcemap (zstd) keeps
      # stacktraces pointing at TS source in production crashes.
      - name: Build binaries
        run: |
          bun build --compile --minify --sourcemap \
            apps/server/index.ts \
            --target=bun-linux-x64 \
            --outfile console-server-linux-x64
          bun build --compile --minify --sourcemap \
            apps/server/index.ts \
            --target=bun-darwin-x64 \
            --outfile console-server-macos-x64

      - name: Smoke test linux binary
        run: |
          chmod +x console-server-linux-x64
          CONSOLE_ENV=dev PORT=3999 ./console-server-linux-x64 &
          SERVER_PID=$!
          for i in $(seq 1 40); do
            curl -sf http://localhost:3999/api/sessions >/dev/null && break
            sleep 0.5
          done
          CODE=$(curl -s -o /dev/null -w "%{http_code}" http://localhost:3999/api/sessions)
          kill $SERVER_PID 2>/dev/null || true
          [ "$CODE" = "200" ] || { echo "Smoke test failed (HTTP $CODE)"; exit 1; }
          echo "Smoke test passed"

      - name: Upload to rolling release (tag: console-server)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: console-server
          name: console-server (latest)
          prerelease: false
          make_latest: true
          files: |
            console-server-linux-x64
            console-server-macos-x64
