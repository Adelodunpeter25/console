[workspace]
members = [
    "crates/console-core",
    "crates/console-ui",
    "src",
]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"

[workspace.dependencies]
gpui = { version = "0.2.2", git = "https://github.com/zed-industries/zed" }
gpui_macros = { version = "0.1.0", git = "https://github.com/zed-industries/zed" }
gpui_platform = { git = "https://github.com/zed-industries/zed", features = ["font-kit", "runtime_shaders"] }

# Internal workspace crates
console-core = { path = "crates/console-core" }
console-ui = { path = "crates/console-ui" }

# Serialization & Networking
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
reqwest = { version = "0.12", default-features = false, features = ["json", "stream", "rustls-tls"] }
futures-util = "0.3"
tokio = { version = "1.0", features = ["full"] }
tokio-stream = "0.1"
anyhow = "1"
log = "0.4"
urlencoding = "2.1"
eventsource-stream = "0.2"
unicode-segmentation = "1.12"
chrono = { version = "0.4", features = ["serde"] }
pulldown-cmark = "0.12"
regex = "1"
base64 = "0.22"
similar = { version = "2", features = ["text"] }
rust-embed = { version = "8.7.2", features = ["interpolate-folder-path", "include-exclude"] }
rfd = "0.15"
