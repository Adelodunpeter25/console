[workspace]
members = [
    "crates/console-core",
    "crates/console-ui",
    "src",
]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"

[workspace.dependencies]
# NOTE: do NOT add `rev` pins here. gpui-component (below) requires zed via a
# bare git URL, and cargo treats `git+url` and `git+url?rev=X` as different
# sources even at the same commit — pinning would split `gpui` in two and fail
# the build. The committed Cargo.lock is what pins zed (with --locked on CI).
gpui = { version = "0.2.2", git = "https://github.com/zed-industries/zed" }
gpui_macros = { version = "0.1.0", git = "https://github.com/zed-industries/zed" }
gpui_platform = { git = "https://github.com/zed-industries/zed", features = ["font-kit", "runtime_shaders"] }

# Internal workspace crates
console-core = { path = "crates/console-core" }
console-ui = { path = "crates/console-ui" }

# UI components (command palette, dialogs, dock). Uses the same pinned zed gpui,
# so cargo unifies sources. Must call gpui_component::init(cx) at startup and wrap
# the window root in Root for overlays to render.
# Pinned to the rev in Cargo.lock: upstream main has since moved to gpui 0.3,
# which cannot unify with the zed-pinned gpui 0.2.2 above (38 compile errors).
gpui-component = { git = "https://github.com/longbridge/gpui-component", rev = "7885c41663c7a6cc68ad0c99b1ba33550f807ff0" }

# Serialization & Networking
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
reqwest = { version = "0.12", default-features = false, features = ["json", "stream", "rustls-tls"] }
futures-util = "0.3"
tokio = { version = "1.0", features = ["full"] }
tokio-stream = "0.1"
tokio-tungstenite = { version = "0.26", features = ["rustls-tls-native-roots"] }
anyhow = "1"
log = "0.4"
env_logger = "0.11"
urlencoding = "2.1"
eventsource-stream = "0.2"
unicode-segmentation = "1.12"
chrono = { version = "0.4", features = ["serde"] }
pulldown-cmark = "0.12"
regex = "1"
base64 = "0.22"
similar = { version = "2", features = ["text"] }
rust-embed = { version = "8.7.2", features = ["interpolate-folder-path", "include-exclude"] }
# Native macOS notifications (UNUserNotificationCenter) — macOS-only, see
# apps/desktop/src/state/macos_notifications.rs. Replaces the old osascript path.
objc2 = { version = "0.6" }
objc2-foundation = { version = "0.3" }
objc2-user-notifications = { version = "0.3" }
block2 = { version = "0.6" }
