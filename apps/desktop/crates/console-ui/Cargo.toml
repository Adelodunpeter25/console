[package]
name = "console-ui"
version.workspace = true
edition.workspace = true
license.workspace = true

[features]
# `cef-browser` swaps the embedded browser backend from wry/WKWebView to
# Chromium via the `cef` crate. Off by default: enabling it downloads and
# links the full CEF distribution, so default builds stay on wry until the
# migration lands.
cef-browser = ["dep:cef"]

[dependencies]
gpui = { workspace = true }
gpui_macros = { workspace = true }
gpui_platform = { workspace = true }
gpui-component = { workspace = true }
console-core = { workspace = true }
syntax = { workspace = true }
editor-ui = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true }
anyhow = { workspace = true }
log = { workspace = true }
unicode-segmentation = { workspace = true }
chrono = { workspace = true }
pulldown-cmark = { workspace = true }
regex = { workspace = true }
base64 = { workspace = true }
resvg = "0.46.0"
usvg = "0.46.0"
tiny-skia = "0.11.4"
imagesize = "0.14"
# Pinned to a rev for reproducible builds (was floating on termy main).
termy_core = { git = "https://github.com/lassejlv/termy", rev = "f5ddada41eab55c26b582140b5ef4eb4c9d696d8" }
# Optional: only built with `--features cef-browser` (see [features] above).
cef = { version = "154.4.0", optional = true }

[target.'cfg(target_os = "macos")'.dependencies]
wry = { version = "0.56", features = ["devtools"] }
# Same major version gpui/wry use, so `HasWindowHandle` impls interoperate.
raw-window-handle = "0.6"
objc2 = { workspace = true }
objc2-foundation = { workspace = true, features = ["NSDictionary", "NSKeyValueObserving", "NSValue", "NSProcessInfo", "NSString", "NSURL", "NSURLRequest", "NSError", "NSData", "NSDictionary", "NSValue", "NSTimer", "NSDate", "NSGeometry", "block2", "objc2-core-foundation"] }
objc2-app-kit = { workspace = true, features = ["NSView", "NSWindow", "NSApplication", "NSEvent", "NSAppearance", "NSImage", "NSImageRep", "NSBitmapImageRep"] }
block2 = { workspace = true }
objc2-web-kit = { workspace = true, features = ["WKWebView", "WKWebViewConfiguration", "WKNavigation", "WKNavigationDelegate", "WKSnapshotConfiguration", "block2"] }

