[package]
name = "console-app"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "console"
path = "main.rs"

[features]
default = []

[dependencies]
gpui = { workspace = true }
gpui_macros = { workspace = true }
gpui_platform = { workspace = true }
console-core = { workspace = true }
console-proto = { workspace = true }
console-shared = { workspace = true }
rust-embed = { workspace = true }
console-ui = { workspace = true }
syntax = { workspace = true }
editor-ui = { workspace = true }
gpui-component = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true }
anyhow = { workspace = true }
log = { workspace = true }
env_logger = { workspace = true }
chrono = { workspace = true }
base64 = { workspace = true }
futures-util = { workspace = true }
urlencoding = { workspace = true }
futures = { workspace = true }
cpal = { workspace = true }

# Compiles console.rc into the exe so Windows has an icon; see build.rs.
[target.'cfg(windows)'.build-dependencies]
embed-resource = "3"

# Single-instance mutex and window activation (see single_instance.rs).
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_System_Threading",
    "Win32_UI_WindowsAndMessaging",
] }

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = { workspace = true }
objc2-foundation = { workspace = true }
objc2-user-notifications = { workspace = true }
objc2-app-kit = { workspace = true, features = ["NSApplication", "NSDockTile", "NSWindow"] }
block2 = { workspace = true }
