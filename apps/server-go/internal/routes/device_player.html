<!doctype html>
<html>
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no" />
<style>
  html, body { margin: 0; padding: 0; height: 100%; width: 100%; background: #0c0c0e; overflow: hidden; user-select: none; -webkit-user-select: none; }
  #stage { position: fixed; top: 0; left: 0; right: 0; bottom: 0; display: flex; align-items: center; justify-content: center; }
  canvas { flex: none; display: block; touch-action: none; -webkit-user-drag: none; }
  #status { display: none; position: absolute; left: 8px; bottom: 8px; font: 11px/1.4 -apple-system, system-ui, sans-serif; color: rgba(255,255,255,.9); background: rgba(180,30,30,.85); padding: 4px 8px; border-radius: 6px; pointer-events: none; }
</style>
</head>
<body>
<div id="stage">
  <canvas id="screen"></canvas>
  <div id="status"></div>
</div>
<script>
(function () {
  const statusEl = document.getElementById('status');
  const canvas = document.getElementById('screen');
  const ctx = canvas.getContext('2d', { alpha: false, desynchronized: true });
  let cfg = null, ws = null, decoder = null;
  let streamW = 0, streamH = 0, codec = '', desc = null, needKey = true, seq = 0, gotFrame = false;
  let retry = null, retryMs = 500, lastReset = 0;
  // Only the newest decoded frame is painted, once per animation frame.
  let pendingFrame = null, pendingAt = 0, rafId = 0, pendingMove = null;

  // Decode/paint timings, reported to the server every 10s so the whole
  // capture -> draw path can be read from one log.
  const sentAt = new Map();
  let st = null;
  const newStats = () => ({ frames: 0, decodeSum: 0, decodeMax: 0, paintSum: 0, paintMax: 0, paints: 0, replaced: 0, backlogSkips: 0, queueMax: 0 });
  st = newStats();
  function flushStats() {
    if (st.frames > 0) {
      send({ type: 'stats', frames: st.frames,
        decodeAvgMs: +(st.decodeSum / st.frames).toFixed(1), decodeMaxMs: +st.decodeMax.toFixed(1),
        paintAvgMs: st.paints ? +(st.paintSum / st.paints).toFixed(1) : 0, paintMaxMs: +st.paintMax.toFixed(1),
        replaced: st.replaced, backlogSkips: st.backlogSkips, decodeQueueMax: st.queueMax });
    }
    st = newStats();
  }
  const statsTimer = setInterval(flushStats, 10000);
  function paint() {
    rafId = 0;
    if (pendingFrame) {
      const frame = pendingFrame; pendingFrame = null;
      const waited = performance.now() - pendingAt;
      st.paints++; st.paintSum += waited; if (waited > st.paintMax) st.paintMax = waited;
      const w = frame.displayWidth || frame.codedWidth || streamW;
      const h = frame.displayHeight || frame.codedHeight || streamH;
      if (w && h && (canvas.width !== w || canvas.height !== h)) {
        canvas.width = w; canvas.height = h;
        fitCanvas();
      }
      if (canvas.width && canvas.height) ctx.drawImage(frame, 0, 0, canvas.width, canvas.height);
      frame.close();
      if (!gotFrame) { gotFrame = true; retryMs = 500; setStatus('streaming'); }
    }
    if (pendingMove) {
      if (!ws || ws.bufferedAmount < 16384) send({ type: 'touch', action: 'move', x: pendingMove.x, y: pendingMove.y });
      pendingMove = null;
    }
  }
  function schedulePaint() { if (!rafId) rafId = requestAnimationFrame(paint); }

  // The host app listens on window.ipc (desktop webview) or AndroidBridge.
  const report = (msg) => {
    try {
      const text = JSON.stringify(msg);
      if (window.ipc && window.ipc.postMessage) window.ipc.postMessage(text);
      else if (window.AndroidBridge && window.AndroidBridge.postMessage) window.AndroidBridge.postMessage(text);
    } catch (e) {}
  };
  const setStatus = (s, isError) => {
    statusEl.textContent = s;
    statusEl.style.display = isError ? 'block' : 'none';
    report({ type: 'status', status: s });
  };

  const stage = document.getElementById('stage');
  // Contain-fit the canvas in pixels. CSS percent max-width/height gave this
  // canvas a 0x0 box in the Android WebView, so size it explicitly instead.
  function fitCanvas() {
    const cw = canvas.width, ch = canvas.height;
    if (!cw || !ch) return;
    const sw = stage.clientWidth || window.innerWidth;
    const sh = stage.clientHeight || window.innerHeight;
    if (!sw || !sh) return;
    const k = Math.min(sw / cw, sh / ch);
    canvas.style.width = Math.max(1, Math.floor(cw * k)) + 'px';
    canvas.style.height = Math.max(1, Math.floor(ch * k)) + 'px';
  }
  window.addEventListener('resize', fitCanvas);

  function closeDecoder() {
    try { if (decoder && decoder.state !== 'closed') decoder.close(); } catch (e) {}
    decoder = null; needKey = true; sentAt.clear();
    if (pendingFrame) { pendingFrame.close(); pendingFrame = null; }
  }

  function stopAll() {
    if (retry) { clearTimeout(retry); retry = null; }
    if (ws) { ws.onclose = null; try { ws.close(); } catch (e) {} ws = null; }
    closeDecoder(); pendingMove = null;
    codec = ''; desc = null; streamW = 0; streamH = 0; seq = 0; gotFrame = false;
  }

  // A cold stream's meta can be sent before the device has reported its
  // encoder config, and then carries no codec at all. The avcC description
  // always arrives before the first key frame, so the WebCodecs codec string
  // can be derived from it (avc1.PPCCLL); without this the decoder is never
  // configured and the viewer sits at "waiting for video" forever.
  function codecFromAvcC(d) {
    // configurationVersion 1 marks an AVCDecoderConfigurationRecord.
    if (!d || d.length < 4 || d[0] !== 1) return '';
    const hex = (n) => n.toString(16).padStart(2, '0');
    return 'avc1.' + hex(d[1]) + hex(d[2]) + hex(d[3]);
  }

  function ensureDecoder() {
    if (decoder) return true;
    if (!codec || !desc) return false;
    if (typeof VideoDecoder === 'undefined') { setStatus('WebCodecs unavailable', true); return false; }
    try {
      decoder = new VideoDecoder({
        output(frame) {
          const t0 = sentAt.get(frame.timestamp);
          if (t0 !== undefined) {
            sentAt.delete(frame.timestamp);
            const d = performance.now() - t0;
            st.decodeSum += d; if (d > st.decodeMax) st.decodeMax = d;
          }
          st.frames++;
          if (pendingFrame) { pendingFrame.close(); st.replaced++; }
          pendingFrame = frame; pendingAt = performance.now();
          schedulePaint();
        },
        error(e) {
          // Usually a missed description/key frame: reset, don't reconnect.
          closeDecoder();
          send({ type: 'reset' });
        },
      });
      decoder.configure({ codec, description: desc, optimizeForLatency: true, hardwareAcceleration: 'prefer-hardware' });
      needKey = true;
      return true;
    } catch (e) {
      setStatus('decoder error: ' + (e && e.message || e), true);
      decoder = null;
      return false;
    }
  }

  function onBinary(buf) {
    const tag = buf[0], payload = buf.subarray(1);
    if (tag === 1) {
      if (desc && decoder && desc.length === payload.length && desc.every((v, i) => v === payload[i])) return;
      const next = payload.slice();
      const nextCodec = codecFromAvcC(next);
      // Same profile/level, new parameter sets (e.g. a resolution change):
      // reconfigure the live decoder instead of tearing it down.
      if (decoder && decoder.state === 'configured' && nextCodec && nextCodec === codec) {
        desc = next;
        try {
          decoder.configure({ codec, description: desc, optimizeForLatency: true, hardwareAcceleration: 'prefer-hardware' });
          needKey = true; sentAt.clear();
          return;
        } catch (e) { /* fall through to a rebuild */ }
      }
      desc = next; if (!codec) codec = nextCodec; closeDecoder(); return;
    }
    if (tag !== 2 && tag !== 3) return;
    if (!ensureDecoder()) return;
    // The first chunk after configure() must be a key frame.
    if (needKey && tag !== 2) return;
    // A decoder falling behind only adds latency: skip to the next key frame.
    if (tag === 3 && decoder.decodeQueueSize > 4) {
      needKey = true; st.backlogSkips++;
      const now = Date.now();
      if (now - lastReset > 1000) { lastReset = now; send({ type: 'reset' }); }
      return;
    }
    if (tag === 2) needKey = false;
    try {
      const ts = (seq++) * 1000;
      sentAt.set(ts, performance.now());
      if (sentAt.size > 120) sentAt.delete(sentAt.keys().next().value); // frames the decoder dropped
      decoder.decode(new EncodedVideoChunk({ type: tag === 2 ? 'key' : 'delta', timestamp: ts, data: payload }));
      if (decoder.decodeQueueSize > st.queueMax) st.queueMax = decoder.decodeQueueSize;
    } catch (e) {}
  }

  function connect() {
    if (!cfg) return;
    setStatus('connecting');
    const sock = new WebSocket(cfg.streamUrl);
    sock.binaryType = 'arraybuffer';
    ws = sock;
    sock.onopen = () => setStatus('waiting for video');
    sock.onmessage = (ev) => {
      if (typeof ev.data === 'string') {
        let m; try { m = JSON.parse(ev.data); } catch (e) { return; }
        if (m.type === 'meta') {
          streamW = m.width; streamH = m.height;
          if (m.codec && m.codec !== codec) { codec = m.codec; closeDecoder(); }
        }
        return;
      }
      onBinary(new Uint8Array(ev.data));
    };
    sock.onclose = () => {
      if (ws !== sock) return;
      ws = null; closeDecoder(); gotFrame = false;
      setStatus('disconnected', true);
      // Session ended (device shut down / slow viewer): re-attach shortly.
      if (cfg) retry = setTimeout(() => { retry = null; connect(); }, retryMs); retryMs = Math.min(retryMs * 2, 8000);
    };
  }

  function send(o) { if (ws && ws.readyState === 1) ws.send(JSON.stringify(o)); }

  function toStream(e) {
    const r = canvas.getBoundingClientRect();
    const x = Math.round((e.clientX - r.left) / Math.max(1, r.width) * streamW);
    const y = Math.round((e.clientY - r.top) / Math.max(1, r.height) * streamH);
    return { x: Math.max(0, Math.min(streamW, x)), y: Math.max(0, Math.min(streamH, y)) };
  }

  let down = false;
  canvas.addEventListener('dragstart', (e) => e.preventDefault());
  canvas.addEventListener('pointerdown', (e) => {
    if (!ws || !streamW) return;
    e.preventDefault();
    try { canvas.setPointerCapture(e.pointerId); } catch (_) {}
    down = true;
    const p = toStream(e);
    send({ type: 'touch', action: 'down', x: p.x, y: p.y });
  });
  canvas.addEventListener('pointermove', (e) => {
    if (!down) return;
    const p = toStream(e);
    pendingMove = p; schedulePaint();
  });
  const release = (e) => {
    if (!down) return;
    down = false; pendingMove = null;
    const p = toStream(e);
    send({ type: 'touch', action: 'up', x: p.x, y: p.y });
    try { canvas.releasePointerCapture(e.pointerId); } catch (_) {}
  };
  canvas.addEventListener('pointerup', release);
  canvas.addEventListener('pointercancel', release);
  canvas.addEventListener('wheel', (e) => {
    e.preventDefault();
    if (!ws || !streamW) return;
    const p = toStream(e);
    send({ type: 'scroll', x: p.x, y: p.y, dx: 0, dy: -Math.sign(e.deltaY) * 16 });
  }, { passive: false });
  window.addEventListener('keydown', (e) => {
    if (!ws) return;
    const map = { Enter: 66, Backspace: 67, Escape: 4, Home: 3 };
    if (e.key in map) { e.preventDefault(); send({ type: 'key', code: map[e.key] }); }
    else if (e.key.length === 1 && !e.metaKey && !e.ctrlKey) { e.preventDefault(); send({ type: 'text', text: e.key }); }
  });

  window.__consoleDevice = {
    start: (json) => {
      stopAll();
      try { cfg = JSON.parse(json); } catch (e) { cfg = null; setStatus('bad config', true); return; }
      if (!cfg || !cfg.streamUrl) { cfg = null; setStatus('no device', true); return; }
      connect();
    },
    stop: () => { cfg = null; stopAll(); setStatus('idle'); },
    button: (name) => send({ type: 'button', button: name }),
  };

  setStatus('ready');
})();
</script>
</body>
</html>
