plugins {
  id 'com.android.library'
  id 'expo-module-gradle-plugin'
}

group = 'expo.modules.nativestream'
version = '1.0.0'

android {
  namespace "expo.modules.nativestream"
  defaultConfig {
    versionCode 1
    versionName "1.0.0"
  }
}

dependencies {
  implementation "com.squareup.okhttp3:okhttp:4.12.0"
}
