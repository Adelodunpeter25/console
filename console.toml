# Project run scripts for the Console monorepo.
# Listed in the desktop Run tab; run with the repo root as working directory.

[scripts.dev-server]
label = "Dev Server :2003"
command = "PORT=2003 go -C apps/server-go run ./cmd/server"
shortcut = "cmd-shift-r"
persistent = true

[scripts.dev-mobile]
label = "Dev Mobile (Native Android)"
command = "cd apps/android && ./gradlew installDebug && adb shell am start -n com.console.mobile/.MainActivity"
shortcut = "cmd-shift-m"
persistent = false

[scripts.dev-desktop]
label = "Dev Desktop"
command = "bash apps/desktop/scripts/dev.sh"
persistent = true
shortcut = "cmd-shift-d"

[scripts.package-desktop]
label = "Package Desktop"
command = "bash apps/desktop/scripts/package.sh"
shortcut = "cmd-shift-p"
persistent = false

[scripts.build-android]
label = "Build Android (Release)"
command = "cd apps/android && ./gradlew assembleRelease"
persistent = false