syntax = "proto3";

package console.v1;

option go_package = "github.com/Adelodunpeter25/console/apps/server-go/internal/gen/console/v1;consolev1";

// OAuth login and credential status (/api/auth/*): provider login state,
// the authorization-URL hand-off, the code-exchange result, the Google Cloud
// project id, and GitHub git-credential state. All three sides.
//
// Notes:
// - email is optional: a credential can carry a token with no account email,
//   so absent and empty are genuinely different.
// - project_id is optional for the same reason. See ProjectIDResponse for the
//   null → absent trim on the project-id routes.
// - the desktop's ProviderAuthStatus also carries project_id and
//   configured_project_id. Those are read by the clients but never populated
//   by /api/auth/status, so they stay optional and read as None.
// - GitHubAuthStatus is a git credential, not a chat session: it exists so
//   `git` can reach private repositories. username and scopes are cached from
//   the moment the token was accepted, so reading status never touches the
//   network. A revoked token still reports connected until re-login.
// - credentials themselves (access/refresh tokens, PATs) never cross this
//   boundary.
// - OAuth provider ids stay plain strings: codex | claude | antigravity |
//   devin, with devin reserved and answering 501. A proto enum would force a
//   client-wide rename for no gain.
message ProviderAuthStatus {
  bool logged_in = 1;
  optional string email = 2;
  // Project id stored inside the provider credential.
  optional string project_id = 3;
  // Project id configured via the settings/project-id endpoint.
  optional string configured_project_id = 4;
}

message GitHubAuthStatus {
  // `optional` (explicit presence) rather than a bare bool. protojson omits
  // an implicit-presence false, so a bare bool would drop `connected` entirely
  // when logged out and the payload would arrive as `{}` — leaving a client
  // unable to tell "disconnected" from "server did not report". Same reasoning
  // as AuthStatusResponse keeping every provider present.
  optional bool connected = 1;
  optional string username = 2;
  repeated string scopes = 3;
}

// Response of GET /api/auth/status. Every provider is always present so a
// client never has to distinguish "logged out" from "not reported".
message AuthStatusResponse {
  ProviderAuthStatus antigravity = 1;
  ProviderAuthStatus codex = 2;
  ProviderAuthStatus devin = 3;
  ProviderAuthStatus claude = 4;
  GitHubAuthStatus github = 5;
}

// Response of POST /api/auth/login/url. state is the single-use token the
// callback must echo back.
message OAuthLoginUrlResponse {
  string provider = 1;
  string auth_url = 2;
  string state = 3;
  string redirect_uri = 4;
}

// Response of POST /api/auth/login/callback.
message OAuthCallbackResponse {
  string provider = 1;
  optional string user_email = 2;
}

// Response of GET /api/auth/project-id/:provider.
//
// project_id is optional. NOTE this is a deliberate wire trim: the route used
// to answer `{"projectId": null}` when unset, and protojson omits an unset
// optional entirely, so the key is now absent. Both clients read it as a
// defaulting Option (`#[serde(default)]` / Wire null), so null and absent
// already meant the same thing to them — no behavior change, just a smaller
// payload.
message ProjectIDResponse {
  optional string project_id = 1;
}

// Response of POST /api/auth/project-id. provider is echoed so a client can
// confirm which credential it just wrote.
message SetProjectIDResponse {
  string provider = 1;
  optional string project_id = 2;
}

message GitHubLogoutResponse {
  bool disconnected = 1;
}

// The GitHub token itself never crosses the boundary: validating a pasted PAT
// answers with the cached username and scopes only.
message GitHubValidateResponse {
  bool connected = 1;
  optional string username = 2;
  repeated string scopes = 3;
}

// Response of GET /api/providers/credentials. One entry per provider that
// accepts a pasted key, so a client can render its fields without inferring
// anything from the catalog.
//
// `configured` is explicit-presence for the same reason GitHubAuthStatus uses
// it: protojson drops an implicit false, and "no key" must be distinguishable
// from "server did not report". `source` says *where the key in use came from*
// — "env" when OPENCODE_API_KEY is set, "stored" when it came from this API.
// They are not interchangeable: an env key survives a "remove" here, so a
// client that hid its field after a remove would be lying about which key is
// live. That distinction is the whole reason this message exists rather than
// folding into ProviderAuthStatus.
message ProviderCredentialStatus {
  optional bool configured = 1;
  optional string source = 2;
  optional string updated_at = 3;
}

// Map of provider id → status. Providers that take a key are always present.
message ProviderCredentialStatuses {
  map<string, ProviderCredentialStatus> providers = 1;
}

// Response of PUT/DELETE /api/providers/:id/credential. The key never appears
// here in any form — neither the value nor a masked prefix.
message SetProviderCredentialResponse {
  string provider = 1;
  optional bool configured = 2;
  optional string source = 3;
  bool removed = 4;
}

// --- Server device pairing -------------------------------------------------
//
// These are the *server's* own credentials, not provider credentials: a
// device token authenticates a client (desktop, phone) to this Console
// server. The server issues one only in exchange for a one-time pairing
// grant, and the token is what every later request carries.
//
// Kept in this file because the routes live under /api/auth/* alongside the
// provider auth routes, and because a client that already speaks this
// envelope needs no second decoder.

// Request of POST /api/auth/pair: redeem a one-time pairing grant for this
// device's own credential.
//
// The grant is a secret, so it only ever travels in this direction — no
// response message carries one back.
message PairDeviceRequest {
  string grant = 1;
  string device_name = 2;
  string platform = 3;
}

// Request of POST /api/auth/pairing-grants: ask for a short-lived grant that
// another device can redeem.
//
// base_url is the address this device reaches the server at. The server
// cannot know it — it may be behind a proxy, a tunnel or a LAN address it
// does not recognise — so the client says which address the other device
// should be pointed at, and the server builds the QR code from it.
message PairingGrantRequest {
  string device_name = 1;
  string platform = 2;
  string base_url = 3;
}

// One paired device, as reported by the server.
message PairedDevice {
  string id = 1;
  string name = 2;
  string platform = 3;
}

// The server's own identity: who a client is about to trust.
//
// A device pairing with a server is handing over a credential, so it needs
// to know which server that is. `id` is a stable random identifier the
// client checks against the id in the pairing URL it was given — a mismatch
// means the URL came from a different machine, and the client should say
// so rather than connect. `name` is the human-readable label shown in the
// confirmation prompt, and `base_url` is the address the client should
// talk to (present when the server knows it).
message ServerIdentity {
  string id = 1;
  string name = 2;
  string version = 3;
  string base_url = 4;
}

// Response of POST /api/auth/pair. The grant was consumed to issue this
// device token; the grant itself is never returned.
//
// expires_at is a protojson int64, so it encodes as a *string* — the
// convention the rest of the schema uses for millisecond timestamps.
message PairDeviceResponse {
  PairedDevice device = 1;
  string token = 2;
  int64 expires_at = 3;
  // The server that issued the token, so the client can confirm it paired
  // with the server it meant to.
  ServerIdentity server = 4;
}

// Response of POST /api/auth/pairing-grants: a short-lived, single-use grant
// another device can exchange for its own token (the QR flow).
//
// qr_png is the same pairing URL rendered as a QR code, so the requesting
// device can show it and the other device can scan it without either of
// them typing anything. It is empty when the server could not render one —
// the grant and the URL are still usable on their own.
message PairingGrantResponse {
  string grant = 1;
  int64 expires_at = 2;
  // The server the grant is for. The phone shows this before redeeming the
  // grant, so the user can see which machine they are about to trust.
  ServerIdentity server = 3;
  // The pairing URL, rendered as a PNG.
  bytes qr_png = 4;
}

// One device paired with the server.
//
// The timestamps are optional (explicit presence) for the same reason
// ProviderCredentialStatus uses it: protojson omits an implicit zero, and
// "never seen" must stay distinguishable from "seen at the epoch". They
// encode as protojson strings.
message ServerDevice {
  string id = 1;
  string name = 2;
  string platform = 3;
  optional int64 created_at = 4;
  optional int64 last_seen_at = 5;
  optional int64 revoked_at = 6;
}

// Response of GET /api/auth/devices.
message ServerDevicesResponse {
  repeated ServerDevice devices = 1;
}

// Request of POST /api/auth/devices/rename: set this device's own display
// name.
//
// A device may only rename itself, so the request carries no device id —
// the server uses the authenticated one. A client that wanted to rename a
// different device would have to forge the caller's identity, which it
// cannot.
message RenameDeviceRequest {
  string name = 1;
}

// Response of POST /api/auth/devices/rename.
message RenameDeviceResponse {
  ServerDevice device = 1;
}

// Response of POST /api/auth/devices/revoke-others: every device except the
// caller's has been revoked.
//
// `revoked_count` is how many were actually revoked, which is not always
// the number of other devices: already-revoked ones are not re-revoked.
message RevokeOthersResponse {
  int64 revoked_count = 1;
}