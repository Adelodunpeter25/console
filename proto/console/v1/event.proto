syntax = "proto3";

package console.v1;

option go_package = "github.com/Adelodunpeter25/console/apps/server-go/internal/gen/console/v1;consolev1";

// Run event payloads (Phase 4). Frame envelopes stay hand-shaped
// ({"type": kind, ...payload}); only structured payloads move here.
// First slice: per-token model stream parts.
//
// The oneof holds scalars directly (not wrapper messages) so the wire stays
// {"part":{"text":"..."}} — a wrapper would add a nesting level
// (part.text.text). Deltas carry exactly one arm, matching what the server
// has always emitted.
message ToolCallPreview {
  string id = 1;
  string name = 2;
}

message ModelStreamPart {
  oneof part {
    string text = 1;
    string thinking = 2;
    ToolCallPreview tool_call = 3;
  }
}

// Turn close + context (Phase 4, third slice). The modelStreamEnd turn
// reuses the transcript schema (AgentAssistantMessage): role/usage keys the
// old hand shape emitted are dropped — no client reads them. Context numbers
// stay JSON numbers (int32 counts, double ratios), so the contextUpdate frame
// and GET /context bytes are unchanged; only their source moves here.
message ContextSnapshot {
  int32 used_tokens = 1;
  int32 context_window = 2;
  double percent_used = 3;
  double threshold_ratio = 4;
  string model_id = 5;
  string provider = 6;
  string source = 7;
}

// Interactive requests (Phase 4, fourth slice). Args cross as raw JSON bytes
// like tool calls. requires_upgrade (desktop permission card) is client-only
// UI state nothing populates, so it stays out of the schema. skippable is
// optional but always set — the old shape had no omitempty, and clients
// distinguish explicit false from absent.
message PermissionRequest {
  string request_id = 1;
  string tool_call_id = 2;
  string tool_name = 3;
  bytes args = 4;
  string tier = 5;
  optional string reason = 6;
}

message AskQuestionRequest {
  string request_id = 1;
  string question = 2;
  repeated string options = 3;
  bool is_multi_select = 4;
  optional bool skippable = 5;
  optional string batch_id = 6;
}

message BrowserActionRequest {
  string request_id = 1;
  string action = 2;
  optional string url = 3;
  optional string script = 4;
  optional string selector = 5;
  optional string tab_id = 6;
  optional string url_contains = 7;
  optional string text = 8;
  int32 timeout_ms = 9;
  optional string ref = 10;
  bool submit = 11;
}

// The error frame carries one string; data was never populated server-side.
message ErrorPayload {
  string message = 1;
}
