syntax = "proto3";

package console.v1;

option go_package = "github.com/Adelodunpeter25/console/apps/server-go/internal/gen/console/v1;consolev1";

import "console/v1/message.proto";

// Sessions (Phase 3, first slice: todos). Session headers, messages, and
// content parts follow in later slices of this file.
//
// Todo statuses stay plain strings — pending, in_progress, completed —
// matched literally on all three sides; no enum, no trimming needed.
message TodoItem {
  int32 id = 1;
  string content = 2;
  string status = 3;
}

// Session headers (Phase 3, second slice). Requests stay hand-parsed:
// create/update distinguish omitted from explicit null (scratchpad), which
// no proto field can express. The GET /:id detail envelope is mixed until
// messages migrate: proto header plus raw message bytes, hasMore, and a
// numeric-or-null cursor assembled by hand.
//
// Timestamps encode as protojson strings. messageCount is optional but
// always populated, preserving the old always-present number. Status and
// thinking level stay plain strings, matched literally on all three sides.
message SessionWorktree {
  string path = 1;
  string branch = 2;
  string repo = 3;
}

message SessionHeader {
  string id = 1;
  string title = 2;
  string cwd = 3;
  optional string project_id = 4;
  string model_id = 5;
  string provider = 6;
  string approval_mode = 7;
  optional string thinking_level = 8;
  int64 created_at = 9;
  int64 updated_at = 10;
  optional int32 message_count = 11;
  string status = 12;
  optional int64 deleted_at = 13;
  SessionWorktree worktree = 14;
}

message SessionDeleteResponse {
  string id = 1;
  bool deleted = 2;
}

message SessionRestoreResponse {
  string id = 1;
  bool restored = 2;
}

message SessionPermanentDeleteResponse {
  string id = 1;
  bool permanently_deleted = 2;
}

// Session file changes (Phase 3, fourth slice): review/inspector rows plus
// the cached diff text. Counts narrow to uint32 so they stay JSON numbers;
// updated_at encodes as a protojson string. Statuses stay plain strings.
// The reviewed POST takes hand-built JSON and returns 204, so it needs no
// messages; the diff payload is just the cached text.
message SessionFileChange {
  string path = 1;
  uint32 turn_index = 2;
  string status = 3;
  uint32 additions = 4;
  uint32 deletions = 5;
  optional string diff_text = 6;
  bool reviewed = 7;
  int64 updated_at = 8;
}

message SessionFileChangeDiff {
  string diff_text = 1;
}

// Live subagent rows (Phase 3, third slice). Subagent start/activity/end
// EVENT frames stay hand-shaped until the event stream migrates; only the
// GET rows move here.
//
// Counts narrow to int32 so they stay JSON numbers; timestamps encode as
// protojson strings. Activity args cross as raw JSON bytes (base64), like
// tool call arguments.
message SubagentActivityItem {
  int32 turn_index = 1;
  string tool_call_id = 2;
  string tool_name = 3;
  optional string summary = 4;
  bytes args = 5;
  string status = 6;
  optional string error = 7;
}

message SubagentInfo {
  string subagent_id = 1;
  string parent_tool_call_id = 2;
  string name = 3;
  string role = 4;
  string prompt = 5;
  int32 max_turns = 6;
  int32 current_turn = 7;
  string status = 8;
  optional string summary = 9;
  optional string error = 10;
  repeated SubagentActivityItem activities = 11;
  int64 created_at = 12;
  int64 updated_at = 13;
}

// Queued prompts (Phase 3, fifth slice): the single staged next-turn prompt
// per session (POST/PUT/GET /api/sessions/:id/queue). The queueUpdated SSE
// frame stays hand-shaped until the event stream migrates, but its nested
// queuedPrompt payload is this message, decoded through the same type.
//
// Shape notes:
// - Attachments and annotations reuse message.proto (same package): image
//   bytes stay inline base64 strings, annotation dimensions/computed styles
//   keep their structured form for replay.
// - created_at is the RFC3339 string the server already stores — plain
//   string passthrough, not millis.
// - thinking_level is desktop-optimistic (pane default attached to the local
//   card); the server never populates it. Plain string, matched literally;
//   the ThinkingLevel enum stays client-side with conversion at the boundary.
// - Request bodies (run/queue/steer/answer/approve) stay hand-parsed.
message QueuedPrompt {
  string id = 1;
  string session_id = 2;
  string prompt = 3;
  repeated string context_files = 4;
  repeated ImageAttachment attachments = 5;
  repeated BrowserAnnotation annotations = 6;
  optional string model_id = 7;
  optional string provider = 8;
  optional string approval_mode = 9;
  optional string thinking_level = 10;
  string created_at = 11;
}
